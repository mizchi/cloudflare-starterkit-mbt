name: CI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.moon
          key: ${{ runner.os }}-moon-${{ hashFiles('moon.mod.json') }}
          restore-keys: |
            ${{ runner.os }}-moon-
      - run: moon update
      - run: moon install
      - name: secretlint
        # Same scan the pre-push hook runs locally; CI catches anything
        # that snuck through `--no-verify`. Scans every tracked file
        # (full repo) rather than a diff, because the CI runner has no
        # meaningful upstream concept on a fresh checkout.
        run: pnpm run lint:secretlint
      - name: db:verify (placeholder mix + int64 bind)
        run: pnpm run db:verify
      - name: type-check
        run: pnpm run check
      - name: build worker bundle
        run: pnpm run build
